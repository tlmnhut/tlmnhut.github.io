<div class="profile">
  <div class="profile-photo">
    <img src="{{ site.author.avatar | prepend: '/images/' | relative_url }}"
         alt="{{ site.author.name }}" width="1059" height="1060" fetchpriority="high">
  </div>
  <div class="profile-body">
    <h1 class="profile-name">{{ site.author.name }}</h1>
    <p class="profile-affiliation">{{ site.author.bio }}</p>
    <p class="profile-links">
      {%- for item in site.data.navigation.academic -%}
      {%- unless forloop.first %}<span class="sep">&middot;</span>{% endunless -%}
      <a href="{{ item.url }}"{% unless item.url contains 'mailto:' %} target="_blank" rel="noopener"{% endunless %}>{{ item.title }}</a>
      {%- endfor -%}
    </p>
  </div>
</div>
