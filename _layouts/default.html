<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}
<body>
  {% include header.html %}

  <main class="wrap content-grid" id="content">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var el = document.documentElement;
        // No explicit choice yet means the CSS default, which is always dark.
        var current = el.getAttribute('data-theme') || 'dark';
        var next = current === 'dark' ? 'light' : 'dark';
        el.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
