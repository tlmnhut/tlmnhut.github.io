# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title       : "Nhut Truong"
description : >-
  Postdoctoral researcher in computational cognitive science at the University of Trento.
url         : "https://tlmnhut.github.io"
baseurl     : ""
repository  : "tlmnhut/tlmnhut.github.io"
lang        : "en"
timezone    : "Europe/Rome"

author:
  name   : "Nhut Truong"
  avatar : "profile_photo.jpg"
  # One line per line of the affiliation block under your name.
  bio:
    - "Computational Cognitive Science"
    - "Object Vision Group"
    - "University of Trento"

google_site_verification: "dSlV_xTOsJ1MohsYy6Aqr3c8SHEl3N2gBDEO83P2KyA"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown    : kramdown
highlighter : rouge
permalink   : /:title/

collections:
  projects:
    # No standalone pages: the themes are rendered inline on the home page.
    # The files still load, so site.projects works.
    output    : false

defaults:
  - scope:
      path : "_pages"
      type : pages
    values:
      layout : page

sass:
  sass_dir : _sass
  style    : compressed

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .idea
