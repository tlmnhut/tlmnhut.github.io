# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title       : "Nhut Truong"
description : >-
  Nhut Truong is a PhD student in computational cognitive science at the Center for
  Mind/Brain Sciences (CIMeC), University of Trento, working on the alignment of AI
  models with human cognition and on topographic models of the brain.
url         : "https://tlmnhut.github.io"
baseurl     : ""
repository  : "tlmnhut/tlmnhut.github.io"
lang        : "en"
timezone    : "Europe/Rome"

author:
  name   : "Nhut Truong"
  avatar : "nhut_july24.jpg"
  bio    : "PhD student in computational cognitive science, Center for Mind/Brain Sciences (CIMeC), University of Trento"

google_site_verification: "dSlV_xTOsJ1MohsYy6Aqr3c8SHEl3N2gBDEO83P2KyA"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown    : kramdown
highlighter : rouge
permalink   : /:title/

collections:
  projects:
    output    : true
    permalink : /research/:name/

defaults:
  - scope:
      path : ""
      type : projects
    values:
      layout : project
  - scope:
      path : "_pages"
      type : pages
    values:
      layout : page

sass:
  sass_dir : _sass
  style    : compressed

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .idea
